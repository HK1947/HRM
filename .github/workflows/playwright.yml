# ═══════════════════════════════════════════════════════════════════════════
# PLAYWRIGHT CI/CD PIPELINE - GitHub Actions (Enterprise Edition)
# ═══════════════════════════════════════════════════════════════════════════
#
# WHAT: Automated test execution on push/PR with sharding, a11y, perf, visual.
# WHY: Fast feedback, parallel execution, quality gates, compliance.
# IF NOT USED: Manual test runs, slow feedback, inconsistent results.
# INTERVIEW TIP: "Sharding splits tests across runners - 4 shards = 4x faster"
# ═══════════════════════════════════════════════════════════════════════════

name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly full regression at 2 AM UTC
    - cron: '0 2 * * *'
    # Weekly accessibility audit on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - api
          - visual
          - accessibility
          - performance

env:
  CI: true
  ENV: staging

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Quality Gate: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # Smoke Tests - Fast feedback on PRs (<5 min)
  # ─────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (Quick Feedback)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event_name == 'pull_request' || github.event.inputs.test_type == 'smoke'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create directories
        run: mkdir -p auth logs

      - name: Run Smoke Tests
        run: npx playwright test --grep @smoke --project=chromium

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Full Regression - Cross-browser with sharding
  # ─────────────────────────────────────────────────────────────────────────
  regression-tests:
    name: Regression (${{ matrix.project }}) - Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'regression' ||
      github.event.inputs.test_type == 'all'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Create directories
        run: mkdir -p auth logs

      - name: Run Regression Tests
        run: |
          npx playwright test \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --grep @regression

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # API Tests - No browser, fast
  # ─────────────────────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: |
      github.event_name == 'pull_request' ||
      github.event.inputs.test_type == 'api' ||
      github.event.inputs.test_type == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        run: npx playwright test --project=api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Accessibility Tests - WCAG 2.1 AA Compliance
  # ─────────────────────────────────────────────────────────────────────────
  accessibility-tests:
    name: Accessibility Audit (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: |
      github.event.schedule == '0 3 * * 0' ||
      github.event.inputs.test_type == 'accessibility' ||
      github.event.inputs.test_type == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create directories
        run: mkdir -p auth logs

      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Performance Tests - Core Web Vitals
  # ─────────────────────────────────────────────────────────────────────────
  performance-tests:
    name: Performance Tests (Web Vitals)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'performance' ||
      github.event.inputs.test_type == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create directories
        run: mkdir -p auth logs

      - name: Run Performance Tests
        run: npm run test:performance

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Visual Regression - Per-browser baselines
  # ─────────────────────────────────────────────────────────────────────────
  visual-tests:
    name: Visual Regression (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'visual' ||
      github.event.inputs.test_type == 'all'
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Create directories
        run: mkdir -p auth logs

      - name: Run Visual Tests
        run: npx playwright test --project=${{ matrix.project }} --grep @visual

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Merge Reports from Sharded Runs
  # ─────────────────────────────────────────────────────────────────────────
  merge-reports:
    name: Merge & Publish Reports
    runs-on: ubuntu-latest
    needs: [regression-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: test-reports

  # ─────────────────────────────────────────────────────────────────────────
  # Slack Notification - Nightly results
  # ─────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, accessibility-tests, performance-tests]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.regression-tests.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.regression-tests.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
            echo "emoji=:warning:" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} Nightly Test Results"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Regression:*\n${{ needs.regression-tests.result || 'skipped' }}" },
                    { "type": "mrkdwn", "text": "*Accessibility:*\n${{ needs.accessibility-tests.result || 'skipped' }}" },
                    { "type": "mrkdwn", "text": "*Performance:*\n${{ needs.performance-tests.result || 'skipped' }}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Report" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
